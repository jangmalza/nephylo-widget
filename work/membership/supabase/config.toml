project_id = "usage-widget-membership"

# Every billing entry point, the two provider webhooks included, serves the
# retired handler from _shared/free-distribution.mjs: 410 BILLING_RETIRED with
# no auth, storage or provider call. verify_jwt stays off because providers and
# schedulers never send a user JWT; the handler needs none.
[functions.billing-api]
verify_jwt = false

[functions.billing-webhook]
verify_jwt = false

[functions.billing-renew]
verify_jwt = false

[functions.international-billing-api]
verify_jwt = false
[functions.international-billing-webhook]
verify_jwt = false
[functions.international-billing-reconcile]
verify_jwt = false
